<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firmar Albaranes</title>

<style>
:root{
  --bg:#0b1220;
  --card:#121b2f;
  --soft:#18233b;
  --soft2:#0f1a2e;
  --text:#ffffff;
  --muted:#b7c3dd;
  --accent:#ff7a18;
  --ok:#1f8b4c;
  --warn:#a66a00;
  --border:rgba(255,255,255,.08);
}

*{
  box-sizing:border-box;
}

body{
  font-family:Arial, sans-serif;
  background:var(--bg);
  color:white;
  margin:0;
  padding:20px;
}

.wrap{
  max-width:950px;
  margin:0 auto;
}

.topbar{
  background:var(--card);
  border-radius:14px;
  padding:16px;
  margin-bottom:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}

.topbar h1{
  margin:0;
  font-size:28px;
}

.muted{
  color:var(--muted);
  font-size:13px;
}

.card{
  background:var(--card);
  padding:20px;
  border-radius:14px;
  margin-bottom:18px;
}

.item{
  background:var(--soft);
  padding:16px;
  border-radius:12px;
  margin-bottom:14px;
  border:1px solid var(--border);
}

.item:last-child{
  margin-bottom:0;
}

.itemHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:12px;
}

.itemTitle{
  font-size:20px;
  font-weight:bold;
}

.badge{
  display:inline-block;
  padding:5px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:bold;
}

.badgePendiente{
  background:rgba(166,106,0,.2);
  color:#ffd995;
}

.badgeFirmado{
  background:rgba(31,139,76,.2);
  color:#c7ffd8;
}

.dataGrid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
  gap:10px;
  margin-bottom:12px;
}

.dataBox{
  background:var(--soft2);
  border-radius:10px;
  padding:12px;
  border:1px solid var(--border);
}

.dataLabel{
  font-size:12px;
  color:var(--muted);
  margin-bottom:6px;
}

.dataValue{
  font-size:15px;
  line-height:1.45;
  word-break:break-word;
}

.obsBox{
  background:var(--soft2);
  border-radius:10px;
  padding:12px;
  border:1px solid var(--border);
  margin-top:10px;
}

.obsTitle{
  font-size:12px;
  color:var(--muted);
  margin-bottom:6px;
}

canvas{
  width:100%;
  height:200px;
  background:white;
  border-radius:10px;
  margin-top:14px;
  touch-action:none;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:12px;
}

button, .btn{
  padding:12px 14px;
  border:none;
  border-radius:10px;
  background:var(--accent);
  color:#1b0c02;
  font-weight:bold;
  cursor:pointer;
  text-decoration:none;
  display:inline-block;
}

button.sec, .btn.sec{
  background:#24314f;
  color:white;
}

button.ok{
  background:var(--ok);
  color:white;
}

#status{
  margin-top:12px;
  font-weight:bold;
  white-space:pre-line;
}

.empty{
  opacity:.85;
  padding:18px;
  text-align:center;
  background:var(--soft2);
  border-radius:12px;
  border:1px solid var(--border);
}

@media (max-width:700px){
  body{
    padding:12px;
  }

  .topbar h1{
    font-size:24px;
  }
}
</style>
</head>
<body>

<div class="wrap">

  <div class="topbar">
    <div>
      <h1>Albaranes pendientes</h1>
      <div class="muted">El cliente puede revisar todos los datos antes de firmar</div>
    </div>

    <div class="actions" style="margin-top:0;">
      <a class="btn sec" href="menu-conductor.html">← Volver</a>
    </div>
  </div>

  <div class="card">
    <div id="lista"></div>
    <div id="status"></div>
  </div>

</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const supabase = createClient(
  "https://jpnritlcfumjmdpoaytr.supabase.co",
  "sb_publishable_6CF_v2_aPe5d3faZfQxAuw_f4epFsYr"
);

const sesion = JSON.parse(localStorage.getItem("sesionAppTransporte") || "null");

if (!sesion || sesion.role !== "driver") {
  window.location.href = "login.html?logout=1";
}

const lista = document.getElementById("lista");
const statusEl = document.getElementById("status");

let albaranesGlobal = [];

function escapeHtml(valor) {
  return String(valor ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function formatearFecha(fechaIso) {
  if (!fechaIso) return "";
  const fecha = new Date(fechaIso);
  if (isNaN(fecha.getTime())) return fechaIso;
  return fecha.toLocaleString("es-ES");
}

function obtenerEstadoBadge(estado) {
  const e = String(estado || "").toLowerCase();
  if (e === "firmado") {
    return `<span class="badge badgeFirmado">Firmado</span>`;
  }
  return `<span class="badge badgePendiente">Pendiente</span>`;
}

function valorSeguro(valor) {
  return valor === null || valor === undefined || valor === "" ? "—" : escapeHtml(valor);
}

async function cargar() {
  try {
    statusEl.innerText = "Cargando albaranes...";

    let query = supabase
      .from("albaranes_electronicos")
      .select("*")
      .eq("estado", "pendiente")
      .order("created_at", { ascending:false });

    if (sesion.empresa_id) {
      query = query.eq("empresa_id", sesion.empresa_id);
    }

    if (sesion.conductor_id) {
      query = query.eq("conductor_id", sesion.conductor_id);
    }

    const { data, error } = await query;

    if (error) {
      statusEl.innerText = "Error cargando albaranes: " + error.message;
      lista.innerHTML = `<div class="empty">No se pudieron cargar los albaranes.</div>`;
      return;
    }

    albaranesGlobal = data || [];

    if (!albaranesGlobal.length) {
      lista.innerHTML = `<div class="empty">No tienes albaranes pendientes.</div>`;
      statusEl.innerText = "";
      return;
    }

    lista.innerHTML = albaranesGlobal.map(a => {
      const id = a.id;

      const cliente = a.cliente || a.client_name || "";
      const direccion = a.direccion || a.dropoff_place || a.lugar_descarga || "";
      const conductor = a.conductor || a.driver_name || "";
      const fechaServicio = a.fecha_servicio || a.fecha || "";
      const observaciones = a.observaciones || a.observations || "";
      const bultos = a.bultos ?? "";
      const kg = a.kg ?? "";
      const m3 = a.m3 ?? "";
      const carga = a.carga || a.pickup_place || a.lugar_carga || "";
      const descarga = a.descarga || a.dropoff_place || a.lugar_descarga || direccion || "";
      const matricula = a.matricula || a.vehicle_plate || "";
      const numEntregas = a.num_entregas ?? "";

      return `
        <div class="item">
          <div class="itemHeader">
            <div class="itemTitle">${escapeHtml(cliente || "Sin cliente")}</div>
            <div>${obtenerEstadoBadge(a.estado)}</div>
          </div>

          <div class="dataGrid">
            <div class="dataBox">
              <div class="dataLabel">Cliente</div>
              <div class="dataValue">${valorSeguro(cliente)}</div>
            </div>

            <div class="dataBox">
              <div class="dataLabel">Conductor</div>
              <div class="dataValue">${valorSeguro(conductor)}</div>
            </div>

            <div class="dataBox">
              <div class="dataLabel">Fecha servicio</div>
              <div class="dataValue">${valorSeguro(fechaServicio)}</div>
            </div>

            <div class="dataBox">
              <div class="dataLabel">Matrícula</div>
              <div class="dataValue">${valorSeguro(matricula)}</div>
            </div>

            <div class="dataBox">
              <div class="dataLabel">Lugar de carga</div>
              <div class="dataValue">${valorSeguro(carga)}</div>
            </div>

            <div class="dataBox">
              <div class="dataLabel">Lugar de descarga</div>
              <div class="dataValue">${valorSeguro(descarga)}</div>
            </div>

            <div class="dataBox">
              <div class="dataLabel">Dirección entrega</div>
              <div class="dataValue">${valorSeguro(direccion)}</div>
            </div>

            <div class="dataBox">
              <div class="dataLabel">Nº entregas</div>
              <div class="dataValue">${valorSeguro(numEntregas)}</div>
            </div>

            <div class="dataBox">
              <div class="dataLabel">Bultos</div>
              <div class="dataValue">${valorSeguro(bultos)}</div>
            </div>

            <div class="dataBox">
              <div class="dataLabel">Kg</div>
              <div class="dataValue">${valorSeguro(kg)}</div>
            </div>

            <div class="dataBox">
              <div class="dataLabel">M3</div>
              <div class="dataValue">${valorSeguro(m3)}</div>
            </div>

            <div class="dataBox">
              <div class="dataLabel">Creado</div>
              <div class="dataValue">${valorSeguro(formatearFecha(a.created_at))}</div>
            </div>
          </div>

          <div class="obsBox">
            <div class="obsTitle">Observaciones</div>
            <div class="dataValue">${valorSeguro(observaciones)}</div>
          </div>

          <canvas id="canvas_${id}" width="800" height="200"></canvas>

          <div class="actions">
            <button class="sec" onclick="limpiar('${id}')">Limpiar firma</button>
            <button class="ok" onclick="firmar('${id}')">Firmar</button>
          </div>
        </div>
      `;
    }).join("");

    albaranesGlobal.forEach(a => {
      setTimeout(() => activarCanvas(a.id), 50);
    });

    statusEl.innerText = "";
  } catch (e) {
    console.error(e);
    statusEl.innerText = "Error inesperado cargando albaranes";
  }
}

function activarCanvas(id) {
  const canvas = document.getElementById("canvas_" + id);
  if (!canvas) return;

  const ctx = canvas.getContext("2d");
  let dibujando = false;

  function iniciar() {
    dibujando = true;
  }

  function terminar() {
    dibujando = false;
    ctx.beginPath();
  }

  function dibujar(e) {
    if (!dibujando) return;
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.strokeStyle = "#111";
    ctx.lineTo(e.offsetX, e.offsetY);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(e.offsetX, e.offsetY);
  }

  function dibujarTouch(e) {
    if (!dibujando) return;
    e.preventDefault();

    const rect = canvas.getBoundingClientRect();
    const escalaX = canvas.width / rect.width;
    const escalaY = canvas.height / rect.height;

    const x = (e.touches[0].clientX - rect.left) * escalaX;
    const y = (e.touches[0].clientY - rect.top) * escalaY;

    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.strokeStyle = "#111";
    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y);
  }

  canvas.addEventListener("mousedown", iniciar);
  canvas.addEventListener("mouseup", terminar);
  canvas.addEventListener("mouseleave", terminar);
  canvas.addEventListener("mousemove", dibujar);

  canvas.addEventListener("touchstart", iniciar, { passive:false });
  canvas.addEventListener("touchend", terminar, { passive:false });
  canvas.addEventListener("touchcancel", terminar, { passive:false });
  canvas.addEventListener("touchmove", dibujarTouch, { passive:false });
}

window.limpiar = function(id) {
  const canvas = document.getElementById("canvas_" + id);
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, canvas.width, canvas.height);
};

window.firmar = async function(id) {
  const canvas = document.getElementById("canvas_" + id);
  if (!canvas) return;

  const firma = canvas.toDataURL();

  try {
    statusEl.innerText = "Guardando firma...";

    const { error } = await supabase
      .from("albaranes_electronicos")
      .update({
        estado: "firmado",
        firma_url: firma
      })
      .eq("id", id);

    if (error) {
      alert("Error: " + error.message);
      statusEl.innerText = "Error guardando firma";
      return;
    }

    alert("Firmado correctamente");
    await cargar();
  } catch (e) {
    console.error(e);
    alert("Error inesperado firmando");
    statusEl.innerText = "Error inesperado firmando";
  }
};

cargar();
</script>

</body>
</html>
